<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wear Relaxed — A curated view of relaxed streetwear.</title>
<meta name="description" content="Wear Relaxed is a curated view of relaxed streetwear — oversized fits, worn-in denim, and everyday layers pulled from the street, not the runway. Discover the brands, people, and pieces defining the look." />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />

<meta property="og:title" content="Wear Relaxed" />
<meta property="og:description" content="A curated view of relaxed streetwear." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://wearrelaxed.com" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header class="nav rise">
    <a class="nav-logo" href="index.html">Wear Relaxed</a>
    <nav class="nav-links">
      <a href="index.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <h1 class="rise d1"><span>Wear</span><span>Relaxed</span></h1>
    <p class="lede rise d2">A curated view of relaxed streetwear.</p>
    <p class="sub rise d2">Oversized fits, worn-in denim, and everyday layers — clothing pulled from the street, not the runway. Discover the brands, people, and pieces defining the look.</p>
    <div class="cta-row rise d3">
      <a class="cta" href="https://instagram.com/wearrelaxed" target="_blank" rel="noopener">Follow on Instagram</a>
      <form class="join-form" id="joinForm" novalidate>
        <input class="join-input" type="email" name="email" placeholder="Email" required autocomplete="email" />
        <button class="cta cta-outline" type="submit">Join the List</button>
      </form>
    </div>
    <p class="join-msg" id="joinMsg" aria-live="polite"></p>
  </main>

  <footer class="bottom rise d4">
    <span class="tag">Wear Relaxed © 2026</span>
    <span class="tag"><a href="https://instagram.com/wearrelaxed" target="_blank" rel="noopener">@wearrelaxed</a></span>
  </footer>

  <script>
    (function(){
      var FORM_ID = 'dWedbV';
      var FIELD_ID = '51441d87-afd5-4830-893a-62dbe07d6057';
      var form = document.getElementById('joinForm');
      var msg = document.getElementById('joinMsg');
      var input = form.querySelector('.join-input');
      var btn = form.querySelector('button');

      function uuid(){
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
          var r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8);
          return v.toString(16);
        });
      }

      form.addEventListener('submit', function(e){
        e.preventDefault();
        var email = input.value.trim();
        if (!email || !input.checkValidity()) {
          msg.textContent = 'Enter a valid email.';
          return;
        }
        btn.disabled = true;
        var original = btn.textContent;
        btn.textContent = 'Joining…';
        msg.textContent = '';

        fetch('https://api.tally.so/forms/' + FORM_ID + '/respond', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            sessionUuid: uuid(),
            respondentUuid: uuid(),
            responses: (function(){ var r = {}; r[FIELD_ID] = email; return r; })(),
            captchas: {},
            isCompleted: true,
            password: null
          })
        }).then(function(res){
          if (!res.ok) throw new Error('bad status');
          form.style.display = 'none';
          msg.textContent = "You're on the list.";
        }).catch(function(){
          btn.disabled = false;
          btn.textContent = original;
          msg.textContent = 'Something went wrong — try again.';
        });
      });
    })();
  </script>

</body>
</html>
